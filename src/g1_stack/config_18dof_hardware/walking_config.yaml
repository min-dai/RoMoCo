
# qp or posik
controller: "posik"

# mlip_flat, dcm, hlip, alip
ro_planner: "dcm"

pose_command: 
  dt_lowpass: 0.0005
  velX_dt_cutoff: 2 
  velY_dt_cutoff: 1
  vx_offset: 0.0
  vy_offset: 0.0
  TSS: 0.3
  TDS: 0.0
  znom: 0.65
  zsw_max: 0.1
  zsw_neg: -0.01
  stepWidthNominal: 0.2
  bezierSwingHorizontal: [0, 0, 1, 1, 1]
  bezierComVertical: [0, 0, 0, 1, 1, 1]
  maxStepSize: 1.
  velXmax: 1
  velYmax: 0.5


friction:  
  frictionCoef: 1
  Lfront: 0.1 #max 0.12
  Lback: -0.04 #max -0.05
  W: 0.025 #max 0.025
  Fz_lb: 100.
  Rot_frictionCoef: 1


posik:
  tol: 0.0001
  max_iter: 1000
  #HipPitch HipRoll HipYaw KneePitch AnklePitch AnkleRoll
  JointKP: [250, 200, 250, 150, 150, 150]
  JointKD: [10,10,10,10,10,10]




