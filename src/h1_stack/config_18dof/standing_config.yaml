
controller: "posik"



pose_command: 
  dt_lowpass: 0.0005
  yd_lowpass_dt_cutoff: [.5, .5, .5, .5, .5, .5]
  stand2step_y_offset: 0.04
  x_offset: 0.0
  x_range: 0.03
  y_range: 0.04
  z_lb: 0.5
  z_ub: 0.8
  pitch_range: .5
  roll_range: 0.1
  yaw_range: 0.05


qp:
  ifprintQP: true
  OutputW:  [1,   1,   1,    1,    1,  1]
  OutputKP: [250, 250, 250, 500, 500, 500]  
  OutputKD: [5,5,5,5,5,5]


id:
  threshold: 0.000001
  OutputKP: [550, 550, 250, 250, 250, 250]
  OutputKD: [5,5,5,5,5,5]


velik:
  #for each leg
  JointKP: [150, 150, 150, 150, 150, 150]
  #for each leg
  JointKD: [3,3,3,3,3,3] 
  output_ik_gain: [1.5, 1, 1, 1, 1, 1]
  
friction:  
  frictionCoef: 1
  Lfront: 0.1 #max 0.12
  Lback: -0.04 #max -0.05
  W: 0.025 #max 0.025
  Fz_lb: 100.
  Rot_frictionCoef: 0.046


posik:
  tol: 0.0001
  max_iter: 1000
  JointKP: [200, 200, 150, 150, 150, 150]
  JointKD: [10,10,10,10,10,10]
